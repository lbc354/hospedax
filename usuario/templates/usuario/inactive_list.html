{% extends 'base.html' %}
{% block content %}
  <h1>Usuários</h1>

  <a href="{% url 'usuario_create' %}">Novo</a>
  <a href="{% url 'usuario_list' %}">Ativos</a>

  <ul>
    {% for u in usuarios %}
      <li>
        {{ u.email }}
        <a href="{% url 'usuario_update_id' u.id %}">Editar</a>
        <a href="{% url 'usuario_delete' u.id %}">Deletar</a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
